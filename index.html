<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الله محبة | God Is Love</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gold: {
                            400: '#facc15',
                            500: '#eab308',
                            600: '#ca8a04',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen transition-colors duration-300 flex flex-col justify-between">

    <!-- Header / Navbar -->
    <header class="p-4 flex justify-between items-center border-b border-slate-800 bg-slate-950/50 backdrop-blur-md sticky top-0 z-50">
        <div class="flex items-center space-x-3 space-x-reverse">
            <i class="fa-solid font-bold text-2xl text-amber-500 fa-heart"></i>
            <span id="nav-logo" class="font-bold text-xl tracking-wide bg-gradient-to-r from-amber-400 to-amber-600 bg-clip-text text-transparent">الله محبة</span>
        </div>
        <div class="flex items-center gap-3">
            <!-- Dark/Light Toggle -->
            <button id="theme-toggle" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-amber-400 transition-all">
                <i id="theme-icon" class="fa-solid fa-sun"></i>
            </button>
            <!-- Language Toggle -->
            <button id="lang-toggle" class="px-3 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold text-sm transition-all border border-slate-700">
                English
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow flex items-center justify-center p-4">
        
        <!-- Auth Box (Login / Signup) -->
        <div id="auth-box" class="w-full max-w-md p-8 rounded-2xl bg-slate-800/80 backdrop-blur-xl border border-slate-700 shadow-2xl transition-all">
            
            <!-- Auth Headers -->
            <div class="text-center mb-6">
                <h1 id="auth-title" class="text-2xl font-bold mb-2 text-white">تسجيل الدخول</h1>
                <p id="auth-subtitle" class="text-sm text-slate-400">أدخل رقم هاتفك وكلمة المرور للمتابعة</p>
            </div>

            <!-- Tabs: Login vs Register -->
            <div class="flex mb-6 bg-slate-900/60 p-1 rounded-xl border border-slate-700/50">
                <button id="tab-login" class="flex-1 py-2 text-sm font-semibold rounded-lg bg-amber-500 text-slate-950 transition-all shadow">
                    تسجيل الدخول
                </button>
                <button id="tab-register" class="flex-1 py-2 text-sm font-semibold rounded-lg text-slate-400 transition-all">
                    حساب جديد
                </button>
            </div>

            <!-- Form -->
            <form id="auth-form" class="space-y-4">
                
                <!-- Phone Field -->
                <div>
                    <label id="lbl-phone" class="block text-xs font-semibold text-slate-300 mb-1">رقم الهاتف</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-400 pointer-events-none icon-pos">
                            <i class="fa-solid fa-phone text-xs"></i>
                        </span>
                        <input type="tel" id="phone-input" required dir="ltr" placeholder="01273791926" class="w-full pl-3 pr-10 py-2.5 bg-slate-900/80 border border-slate-700 rounded-xl focus:ring-2 focus:ring-amber-500 focus:border-amber-500 outline-none text-slate-100 text-sm transition-all">
                    </div>
                </div>

                <!-- Password Field -->
                <div>
                    <label id="lbl-password" class="block text-xs font-semibold text-slate-300 mb-1">كلمة المرور</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-400 pointer-events-none icon-pos">
                            <i class="fa-solid fa-lock text-xs"></i>
                        </span>
                        <input type="password" id="password-input" required dir="ltr" placeholder="••••••••" class="w-full pl-3 pr-10 py-2.5 bg-slate-900/80 border border-slate-700 rounded-xl focus:ring-2 focus:ring-amber-500 focus:border-amber-500 outline-none text-slate-100 text-sm transition-all">
                    </div>
                </div>

                <!-- Password Strength Meter (Shown only on Register) -->
                <div id="password-strength-container" class="hidden space-y-1">
                    <div class="flex justify-between text-xs text-slate-400">
                        <span id="strength-lbl">قوة كلمة المرور:</span>
                        <span id="strength-text" class="font-bold text-red-400">ضعيفة جداً</span>
                    </div>
                    <div class="w-full h-1.5 bg-slate-700 rounded-full overflow-hidden">
                        <div id="strength-bar" class="h-full w-0 bg-red-500 transition-all duration-300"></div>
                    </div>
                    <p id="strength-hint" class="text-[10px] text-slate-400">يجب أن تحتوي على 8 أحرف على الأقل، حرف كبير، حرف صغير، رقم، ورمز خاص.</p>
                </div>

                <!-- Alert/Error Message -->
                <div id="alert-msg" class="hidden p-3 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 text-xs text-center font-medium"></div>

                <!-- Submit Button -->
                <button type="submit" id="submit-btn" class="w-full py-3 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl shadow-lg shadow-amber-500/20 transition-all flex items-center justify-center gap-2 mt-2">
                    <span id="btn-text">تسجيل الدخول</span>
                    <i class="fa-solid fa-arrow-left text-xs" id="btn-arrow"></i>
                </button>
            </form>
        </div>

        <!-- Dashboard View (Shown after Login) -->
        <div id="dashboard-box" class="hidden w-full max-w-2xl p-8 rounded-2xl bg-slate-800/80 backdrop-blur-xl border border-slate-700 shadow-2xl transition-all space-y-6 text-center">
            
            <!-- User Status Header -->
            <div class="flex justify-between items-center border-b border-slate-700 pb-4">
                <div class="text-right">
                    <span id="welcome-txt" class="text-xs text-slate-400">أهلاً بك</span>
                    <h2 id="user-phone-display" class="font-bold text-lg text-amber-400" dir="ltr"></h2>
                </div>
                <div class="flex items-center gap-2">
                    <span id="admin-badge" class="hidden px-2.5 py-1 bg-amber-500/20 text-amber-400 border border-amber-500/30 rounded-full text-xs font-bold">
                        <i class="fa-solid fa-shield-halved ml-1"></i> مسؤول (Admin)
                    </span>
                    <button id="logout-btn" class="px-3 py-1.5 bg-red-500/20 hover:bg-red-500/30 text-red-400 rounded-xl text-xs font-semibold transition-all border border-red-500/30">
                        <i class="fa-solid fa-right-from-bracket"></i> خروج
                    </button>
                </div>
            </div>

            <!-- Central Content Section -->
            <div class="py-8 px-4 rounded-2xl bg-slate-900/60 border border-slate-700/50 space-y-4">
                <h1 class="text-3xl md:text-5xl font-extrabold bg-gradient-to-r from-amber-300 via-amber-400 to-amber-600 bg-clip-text text-transparent">
                    الله محبة
                </h1>
                <p id="god-is-love-subtitle" class="text-slate-400 text-sm">God Is Love</p>

                <!-- Dynamic Message Box -->
                <div class="pt-4 border-t border-slate-800/80 mt-4">
                    <div id="dynamic-message-display" class="text-lg md:text-xl font-medium text-slate-200 leading-relaxed italic">
                        <i class="fa-solid fa-spinner fa-spin text-amber-400"></i> جاري تحميل الرسالة...
                    </div>
                </div>
            </div>

            <!-- Admin Control Panel (Only visible for Admin 01273791926) -->
            <div id="admin-panel" class="hidden border-t border-slate-700 pt-6 space-y-3 text-right">
                <label id="lbl-admin-input" class="block text-xs font-bold text-amber-400">
                    <i class="fa-solid fa-pen-to-square"></i> لوحة التحكم: تعديل النص المعروض بجانب/أسفل "الله محبة"
                </label>
                <textarea id="admin-message-input" rows="3" placeholder="اكتب الرسالة أو الآية هنا..." class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl focus:ring-2 focus:ring-amber-500 focus:border-amber-500 outline-none text-slate-100 text-sm transition-all resize-none"></textarea>
                <div class="flex justify-end">
                    <button id="save-msg-btn" class="px-5 py-2.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl text-sm transition-all shadow-md flex items-center gap-2">
                        <i class="fa-solid fa-floppy-disk"></i>
                        <span id="btn-save-txt">حفظ ونشر التعديل</span>
                    </button>
                </div>
                <div id="admin-alert" class="hidden text-xs text-emerald-400 font-medium"></div>
            </div>

        </div>

    </main>

    <!-- Footer -->
    <footer class="p-4 text-center text-slate-500 text-xs border-t border-slate-800 bg-slate-950/30">
        &copy; 2026 جميع الحقوق محفوظة - الله محبة
    </footer>

    <!-- Firebase SDK Modular Import -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, get, child, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyB6x3QixsxsXvsx1aAYetq73o19XaMDJFI",
            authDomain: "godisloveapp.firebaseapp.com",
            databaseURL: "https://godisloveapp-default-rtdb.firebaseio.com",
            projectId: "godisloveapp",
            storageBucket: "godisloveapp.firebasestorage.app",
            messagingSenderId: "8297890335",
            appId: "1:8297890335:web:9a07147c5d731bbaeb0b2a",
            measurementId: "G-Y0NT3P739D"
        };

        // Initialize Firebase Realtime Database
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Admin Credentials
        const ADMIN_PHONE = "01273791926";
        const ADMIN_PASS = "Beshoy@999";

        // DOM Elements
        const authBox = document.getElementById('auth-box');
        const dashboardBox = document.getElementById('dashboard-box');
        const authForm = document.getElementById('auth-form');
        const tabLogin = document.getElementById('tab-login');
        const tabRegister = document.getElementById('tab-register');
        const phoneInput = document.getElementById('phone-input');
        const passwordInput = document.getElementById('password-input');
        const authTitle = document.getElementById('auth-title');
        const authSubtitle = document.getElementById('auth-subtitle');
        const btnText = document.getElementById('btn-text');
        const btnArrow = document.getElementById('btn-arrow');
        const alertMsg = document.getElementById('alert-msg');
        const pwdStrengthContainer = document.getElementById('password-strength-container');
        const strengthBar = document.getElementById('strength-bar');
        const strengthText = document.getElementById('strength-text');
        
        const userPhoneDisplay = document.getElementById('user-phone-display');
        const adminBadge = document.getElementById('admin-badge');
        const adminPanel = document.getElementById('admin-panel');
        const adminMessageInput = document.getElementById('admin-message-input');
        const saveMsgBtn = document.getElementById('save-msg-btn');
        const dynamicMsgDisplay = document.getElementById('dynamic-message-display');
        const logoutBtn = document.getElementById('logout-btn');
        const adminAlert = document.getElementById('admin-alert');

        const themeToggle = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const langToggle = document.getElementById('lang-toggle');

        let mode = 'login'; // 'login' or 'register'
        let currentLang = 'ar'; // 'ar' or 'en'

        // Realtime Listener for Message
        const messageRef = ref(db, 'siteContent/customMessage');
        onValue(messageRef, (snapshot) => {
            const val = snapshot.val();
            if (val) {
                dynamicMsgDisplay.textContent = val;
            } else {
                dynamicMsgDisplay.textContent = "«الله محبة، ومن يثبت في المحبة، يثبت في الله والله فيه»";
            }
        });

        // Tab Switching Logic
        tabLogin.addEventListener('click', () => {
            mode = 'login';
            tabLogin.className = "flex-1 py-2 text-sm font-semibold rounded-lg bg-amber-500 text-slate-950 transition-all shadow";
            tabRegister.className = "flex-1 py-2 text-sm font-semibold rounded-lg text-slate-400 transition-all";
            pwdStrengthContainer.classList.add('hidden');
            updateLangUI();
            hideAlert();
        });

        tabRegister.addEventListener('click', () => {
            mode = 'register';
            tabRegister.className = "flex-1 py-2 text-sm font-semibold rounded-lg bg-amber-500 text-slate-950 transition-all shadow";
            tabLogin.className = "flex-1 py-2 text-sm font-semibold rounded-lg text-slate-400 transition-all";
            pwdStrengthContainer.classList.remove('hidden');
            updateLangUI();
            hideAlert();
        });

        // Password Strength Check Algorithm
        passwordInput.addEventListener('input', () => {
            if (mode !== 'register') return;
            const val = passwordInput.value;
            let score = 0;

            if (val.length >= 8) score++;
            if (/[A-Z]/.test(val)) score++;
            if (/[a-z]/.test(val)) score++;
            if (/[0-9]/.test(val)) score++;
            if (/[^A-Za-z0-9]/.test(val)) score++;

            switch (score) {
                case 0:
                case 1:
                case 2:
                    strengthBar.style.width = "25%";
                    strengthBar.className = "h-full bg-red-500 transition-all duration-300";
                    strengthText.textContent = currentLang === 'ar' ? "ضعيفة جداً" : "Very Weak";
                    strengthText.className = "font-bold text-red-400";
                    break;
                case 3:
                case 4:
                    strengthBar.style.width = "65%";
                    strengthBar.className = "h-full bg-amber-500 transition-all duration-300";
                    strengthText.textContent = currentLang === 'ar' ? "متوسطة" : "Medium";
                    strengthText.className = "font-bold text-amber-400";
                    break;
                case 5:
                    strengthBar.style.width = "100%";
                    strengthBar.className = "h-full bg-emerald-500 transition-all duration-300";
                    strengthText.textContent = currentLang === 'ar' ? "قوية جداً" : "Very Strong";
                    strengthText.className = "font-bold text-emerald-400";
                    break;
            }
        });

        // Form Submission (Login & Register)
        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideAlert();

            const phone = phoneInput.value.trim();
            const password = passwordInput.value;

            if (!phone || !password) {
                showAlert(currentLang === 'ar' ? "يرجى ملء كافة الحقول المطلوب" : "Please fill in all fields");
                return;
            }

            // Check if user is logging in as Admin
            if (phone === ADMIN_PHONE) {
                if (password === ADMIN_PASS) {
                    // Save Admin to Database automatically if not present
                    await set(ref(db, 'users/' + phone), { phone, role: 'admin' });
                    loginSuccess(phone, true);
                    return;
                } else if (mode === 'login') {
                    showAlert(currentLang === 'ar' ? "كلمة المرور غير صحيحة لحساب الآدمن" : "Incorrect password for admin account");
                    return;
                }
            }

            const userRef = ref(db, 'users/' + phone);

            if (mode === 'register') {
                // Strong Password Validation
                const strongPwdRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&#^()_-])[A-Za-z\d@$!%*?&#^()_-]{8,}$/;
                if (!strongPwdRegex.test(password)) {
                    showAlert(currentLang === 'ar' ? "كلمة المرور لا تستوفي شروط الأمان (8 أحرف، حرف كبير، حرف صغير، رقم، ورمز)" : "Password does not meet security requirements");
                    return;
                }

                // Check if user already exists
                try {
                    const snapshot = await get(userRef);
                    if (snapshot.exists()) {
                        showAlert(currentLang === 'ar' ? "عفواً، رقم الهاتف هذا مسجل مسبقاً!" : "Sorry, this phone number is already registered!");
                        return;
                    }

                    // Register new user in Realtime Database
                    await set(userRef, {
                        phone: phone,
                        password: password, // In production, hash passwords
                        createdAt: new Date().toISOString()
                    });

                    loginSuccess(phone, false);

                } catch (error) {
                    showAlert(currentLang === 'ar' ? "حدث خطأ أثناء الاتصال بقاعدة البيانات" : "Database connection error");
                }

            } else {
                // Login Mode
                try {
                    const snapshot = await get(userRef);
                    if (!snapshot.exists()) {
                        showAlert(currentLang === 'ar' ? "رقم الهاتف هذا غير مسجل، يرجى إنشاء حساب جديد" : "Phone number not found, please register");
                        return;
                    }

                    const userData = snapshot.val();
                    if (userData.password === password) {
                        loginSuccess(phone, userData.role === 'admin' || phone === ADMIN_PHONE);
                    } else {
                        showAlert(currentLang === 'ar' ? "كلمة المرور غير صحيحة!" : "Incorrect password!");
                    }
                } catch (error) {
                    showAlert(currentLang === 'ar' ? "حدث خطأ أثناء فحص البيانات" : "Error checking credentials");
                }
            }
        });

        // Successful Login
        function loginSuccess(phone, isAdmin) {
            authBox.classList.add('hidden');
            dashboardBox.classList.remove('hidden');
            userPhoneDisplay.textContent = phone;

            if (isAdmin) {
                adminBadge.classList.remove('hidden');
                adminPanel.classList.remove('hidden');
                // Fetch existing message into textarea
                get(ref(db, 'siteContent/customMessage')).then(snapshot => {
                    if (snapshot.exists()) {
                        adminMessageInput.value = snapshot.val();
                    }
                });
            } else {
                adminBadge.classList.add('hidden');
                adminPanel.classList.add('hidden');
            }
        }

        // Save Admin Message
        saveMsgBtn.addEventListener('click', async () => {
            const newMsg = adminMessageInput.value.trim();
            if (!newMsg) return;

            try {
                await set(ref(db, 'siteContent/customMessage'), newMsg);
                adminAlert.textContent = currentLang === 'ar' ? "تم تحديث النص ونشره بنجاح!" : "Message updated successfully!";
                adminAlert.classList.remove('hidden');
                setTimeout(() => adminAlert.classList.add('hidden'), 3000);
            } catch (err) {
                alert("حدث خطأ أثناء الحفظ");
            }
        });

        // Logout
        logoutBtn.addEventListener('click', () => {
            dashboardBox.classList.add('hidden');
            authBox.classList.remove('hidden');
            phoneInput.value = '';
            passwordInput.value = '';
            hideAlert();
        });

        // Helpers
        function showAlert(msg) {
            alertMsg.textContent = msg;
            alertMsg.classList.remove('hidden');
        }

        function hideAlert() {
            alertMsg.classList.add('hidden');
        }

        // Dark/Light Theme Switch
        themeToggle.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            if (document.documentElement.classList.contains('dark')) {
                themeIcon.className = "fa-solid fa-sun";
            } else {
                themeIcon.className = "fa-solid fa-moon text-slate-700";
            }
        });

        // Language Switcher
        langToggle.addEventListener('click', () => {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            langToggle.textContent = currentLang === 'ar' ? 'English' : 'عربي';
            
            // Adjust icon alignment based on text direction
            document.querySelectorAll('.icon-pos').forEach(el => {
                if (currentLang === 'en') {
                    el.classList.remove('right-0', 'pr-3');
                    el.classList.add('left-0', 'pl-3');
                } else {
                    el.classList.remove('left-0', 'pl-3');
                    el.classList.add('right-0', 'pr-3');
                }
            });

            updateLangUI();
        });

        function updateLangUI() {
            if (currentLang === 'ar') {
                authTitle.textContent = mode === 'login' ? "تسجيل الدخول" : "إنشاء حساب جديد";
                authSubtitle.textContent = mode === 'login' ? "أدخل رقم هاتفك وكلمة المرور للمتابعة" : "قم بملء البيانات التالية للبدء";
                tabLogin.textContent = "تسجيل الدخول";
                tabRegister.textContent = "حساب جديد";
                document.getElementById('lbl-phone').textContent = "رقم الهاتف";
                document.getElementById('lbl-password').textContent = "كلمة المرور";
                btnText.textContent = mode === 'login' ? "تسجيل الدخول" : "إنشاء الحساب";
                btnArrow.className = "fa-solid fa-arrow-left text-xs";
                document.getElementById('welcome-txt').textContent = "أهلاً بك";
                document.getElementById('btn-save-txt').textContent = "حفظ ونشر التعديل";
            } else {
                authTitle.textContent = mode === 'login' ? "Sign In" : "Create Account";
                authSubtitle.textContent = mode === 'login' ? "Enter your credentials to continue" : "Fill details below to get started";
                tabLogin.textContent = "Sign In";
                tabRegister.textContent = "Register";
                document.getElementById('lbl-phone').textContent = "Phone Number";
                document.getElementById('lbl-password').textContent = "Password";
                btnText.textContent = mode === 'login' ? "Sign In" : "Register Now";
                btnArrow.className = "fa-solid fa-arrow-right text-xs";
                document.getElementById('welcome-txt').textContent = "Welcome";
                document.getElementById('btn-save-txt').textContent = "Save & Publish";
            }
        }
    </script>
</body>
</html>
